name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Smoke-run training (fake data, 1 epoch)
        run: python src/train.py --config configs/smoke_config.yaml

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build training image
        run: docker build -f docker/Dockerfile.train -t mlops-train:ci .

      - name: Build serving image
        run: docker build -f docker/Dockerfile.serve -t mlops-serve:ci .
