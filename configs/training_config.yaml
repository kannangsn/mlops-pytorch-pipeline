model:
  architecture: resnet18        # resnet18 or simple_cnn
  num_classes: 10

training:
  epochs: 10
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 3
  seed: 42
  # max_batches: 5              # uncomment to cap batches/epoch (smoke runs)

data:
  dataset: cifar10              # cifar10 or fake (fake = random data for tests)
  data_dir: /app/data
  num_workers: 2

output:
  checkpoint_dir: /app/checkpoints
  model_name: classifier_v1.pt
